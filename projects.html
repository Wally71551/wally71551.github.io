<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Library — Wally71551</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body id="main">
    <div class="header-container">
        <h1>Project Library</h1>
    </div>

    <template id="platforms-template">
        <section class="platform-collapsible">
            <header class="platform-header">
                <h2 class="platform-title"></h2>
                <div class="platform-image-wrapper">
                    <img loading="lazy" class="platform-image" />
                </div>
            </header>

            <div class="platform-content-grid">
            </div>
        </section>
    </template>

    <template id="project-grid">
            <div class="grid-item">
                <div class="grid-item-image-wrapper">
                    <img loading="lazy" src="" alt=""/>
                </div>
                <div class="project-title-wrapper">
                    <p class="project-title"></p>
                    <div class="project-count-wrapper">
                        <img class="count-icon" src="/icons/WTop.svg" loading="lazy"/>
                        <span class="project-count"></span>
                    </div>
                </div>
            </div>
    </template>

    <template id="project-details">
        <div class="project-details-panel">
            <h2 class="project-detailed-title"></h2>
            <h3 class="project-type"></h3>
            <h4 class="release-date"></h4>
            <h3 class="project-collection-header">Collection Contents</h3>
            <ul class="project-collection-list"></ul>
            <div class="project-description"></div>
            <h3 class="project-track-header">Tracks</h3>
            <ul class="project-track-list"></ul>
        </div>
    </template>

    <template id="track-list-item">
        <li class="track-list-item">
            <div class="track-list-header">
                <p class="track-list-album-number"></p>
                <div class="track-list-header-text">
                    <p class="track-list-name"></p>
                    <p class="track-project-name"></p>
                </div>
                <div class="track-link-buttons">
                </div>
            </div>
            <div class="track-details-wrapper"></div>
        </li>
    </template>

    <template id="track-details">
        <div class="track-details-panel">
            <h3 class="track-type"></h3>
            <h4 class="release-date"></h4>
            <h4 class="track-album"></h4>
            <h3 class="track-arranger track-description-header"></h3>
            <h3 class="linked-track-header track-description-header">Based On</h3>
            <ul class="track-linked-tracks"></ul>
            <h3 class="track-info-header" track-description-header>Original Track Info</h3>
            <p class="track-composer artist-info"></p>
            <ul class="track-info-list"></ul>
            <h3 class="track-transcriber-header track-description-header">Transcribers</h3>
            <ul class="track-transcriber-list"></ul>
            <h4 class="track-album-display"></h4>
            <p class="track-album-track-num-display"></p>
            <h3 class="track-description-header track-description-header">Description</h3>
            <div class="track-description"></div>
        </div>
    </template>

    <template id="track-transcriber-list-item">
        <li class="track-details--itranscribernfo">
            <a class="artist-info" target="_blank" rel="noopener noreferrer"></a>
        </li>
    </template>

    <template id="track-info-list-item">
        <li class="track-details-transcriber-info">
            <p class="artist-info"></p>
        </li>
    </template>

    <template id="track-linked-track-item">
        <li class="track-linked-track-item">
            <p class="track-list-name"></p>
            <p class="track-project-name"></p>
            <ul class="linked-track-artists"></ul>
        </li>
    </template>

    <template id="track-linked-track-artist">
        <li class="track-linked-track-artist">
            <p class="linked-track-artist-info"></a>
        </li>
    </template>

    <template id="external-link-icon">
        <a class="external-link" target="_blank" rel="noopener noreferrer">
            <img class="external-link-display-icon">
        </a>
    </template>

    <div id="content"></div>

    <script src="scripts/dataLoad.js"></script>
    <script src="scripts/pageLoad.js"></script>
    <script src="scripts/projectsLoad.js"></script>

    <project-footer></project-footer>
</body>
</html>
