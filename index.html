<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects — Wally71551</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Project Library</h1>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetail()">✖</span>
            <img id="modal-image" src="" alt="">
            <h2 id="modal-title"></h2>
            <p id="modal-desc">This is where your description text would go.</p>
        </div>
    </div>

    <template id="platforms-template">
        <section class="collapsible">
            <header class="platform-header">
                <h2 class="platform-title"></h2>
                <img class="platform-image" />
            </header>

            <div class="platform-content-grid">
                
            </div>
        </section>
    </template>

    <template id="project-grid">
            <div class="grid-item">
                <img src="" alt=""/>
            </div>
    </template>

    <script src="scripts/dataLoad.js"></script>
    <script src="scripts/projectsLoad.js"></script>
</body>
</html>
